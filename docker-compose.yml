services:
  postgres:
    image: postgres:17-alpine
    container_name: reach-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: reach_user
      POSTGRES_PASSWORD: reach_password
      POSTGRES_DB: reach_db

    ports:
      - "5432:5432"

    volumes:
      - reach_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: reach-backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      DATABASE_URL: postgresql://reach_user:reach_password@postgres:5432/reach_db

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}

      PORT: 5000

    depends_on:
      - postgres

volumes:
  reach_postgres_data: